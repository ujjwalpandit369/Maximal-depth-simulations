<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Simulation: de Sitter Geodesic Runner</title>
    <style>
        /* Final Styles */
        :root { --bg-color: #f8f9fa; --text-color: #212529; --section-bg-color: #ffffff; --border-color: #dee2e6; --accent-color: #6f42c1; --button-bg-color: #e9ecef; --button-hover-bg-color: #ced4da; }
        body.high-contrast { --bg-color: #000; --text-color: #fff; --header-bg-color: #111; --section-bg-color: #111; --border-color: #aaa; --accent-color: #ffc107; --button-bg-color: #333; --button-hover-bg-color: #555; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; line-height: 1.6; margin: 0; padding: 20px; background-color: var(--bg-color); color: var(--text-color); }
        main { display: grid; grid-template-columns: 300px 1fr; gap: 20px; max-width: 1400px; margin: 0 auto; }
        header { grid-column: 1 / -1; text-align: center; margin-bottom: 20px; }
        canvas { border: 1px solid var(--border-color); width: 100%; height: auto; cursor: crosshair; }
        section { border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; background-color: var(--section-bg-color); }
        .panel { border-top: 1px solid #eee; padding-top: 10px; margin-top: 10px; }
        .control-group { margin: 15px 0; }
        #exposition-container { border-top: 1px solid var(--border-color); margin-top: 10px; padding-top: 10px; }
        footer { grid-column: 1 / -1; border-top: 1px solid var(--border-color); margin-top: 40px; padding-top: 20px; font-size: 0.9em; }
        #dev-console.hidden { display: none; } #quality-check-list li.fail { color: #dc3545; } #quality-check-list li.pass { color: #28a745; }
    </style>
</head>
<body>
    <header><h1>The de Sitter Geodesic Runner</h1></header>
    <main>
        <div id="left-column">
            <section id="controls">
                <!-- ... controls ... -->
            </section>
            <section id="data-panels">
                <!-- ... data panels ... -->
            </section>
        </div>
        <div id="right-column">
            <section id="visualization"><canvas id="main-canvas" width="1000" height="750"></canvas></section>
            <section id="theory-panel">
                <h2>The Physics of an Expanding Universe</h2>
                <button id="load-exposition-btn">Read the Full Exposition</button>
                <div id="exposition-container"></div>
            </section>
        </div>
    </main>
    <footer>
        <div id="export-controls"></div>
        <div id="quality-check-panel"><h3>Quality Self-Check</h3><ul id="quality-check-list"></ul></div>
        <div id="dev-console-container"><button id="dev-console-toggle">Dev Console</button><div id="dev-console" class="hidden"></div></div>
    </footer>
    <script>
        // Full final script
    </script>
</body>
</html>
